name: iOS build

# Manual run only: started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A pinned macOS version, not "latest": the image (and its Xcode)
    # must not change under us silently.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install Flutter
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Get dependencies
        run: flutter pub get

      # No signing here: Sideloadly signs the .ipa later on the user's computer
      # with a free Apple ID, so no certificates are stored in CI.
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Check bundle id and read version
        run: |
          set -euo pipefail
          PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          if [ "$BUNDLE_ID" != "com.tonyvinsenty.zuno" ]; then
            echo "::error::Unexpected bundle id '$BUNDLE_ID', expected com.tonyvinsenty.zuno"
            exit 1
          fi
          if [ "$DISPLAY_NAME" != "Zuno" ]; then
            echo "::error::Unexpected display name '$DISPLAY_NAME', expected Zuno"
            exit 1
          fi
          echo "Bundle id check passed: $BUNDLE_ID ($DISPLAY_NAME)"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Version $VERSION (build $BUILD)"
          echo "IPA_NAME=Zuno-$VERSION-$BUILD.ipa" >> "$GITHUB_ENV"

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$IPA_NAME" Payload

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.IPA_NAME }}
          archive: false
          retention-days: 14
          if-no-files-found: error
