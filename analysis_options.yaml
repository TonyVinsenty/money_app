# Настройки анализатора Dart (запуск: `flutter analyze`).
# Подробнее: https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true # запрет неявного приведения типов (dynamic -> конкретный)
    strict-inference: true # если тип нельзя вывести, анализатор просит указать явно
    strict-raw-types: true # запрет «сырых» дженериков вроде List вместо List<int>
  errors:
    missing_return: error # функция с типом результата обязана вернуть значение
    missing_required_param: error # обязательный параметр нельзя пропускать

linter:
  rules:
    - always_declare_return_types # у функций всегда явный тип результата
    - always_use_package_imports # только package:-импорты, без относительных путей
    - avoid_dynamic_calls # не вызывать методы у dynamic, там нет проверки типов
    - avoid_slow_async_io # медленные асинхронные файловые вызовы заменять быстрыми
    - cancel_subscriptions # подписку на поток нужно отменять (ADR 0002, утечки)
    - close_sinks # Sink/StreamController нужно закрывать (ADR 0002, утечки)
    - directives_ordering # единый порядок импортов и экспортов
    - only_throw_errors # бросать только Error/Exception, не строки и числа
    - prefer_final_in_for_each # переменная цикла for-in — final
    - prefer_final_locals # локальные переменные, которые не меняются, — final
    - prefer_single_quotes # строки в одинарных кавычках
    - sort_pub_dependencies # зависимости в pubspec.yaml по алфавиту
    - unawaited_futures # забытый await у Future в async-функции — вероятная ошибка
    - unnecessary_lambdas # не оборачивать функцию в лишнюю лямбду
